spring:
  threads:
    virtuals:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/razorpay-db
    username: ${DB_USERNAME:ajay}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    listener:
      ack-mode: manual
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: razorpay-clone-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ajay.razorpay.*"
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost


logging:
  level:
    org.kafka.clients: WARN
    org.apache.kafka.common: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  kafka:
    topics:
      payment: payments.events
      order: order.events
      refund: refund.events
      settlement: settlement.events
